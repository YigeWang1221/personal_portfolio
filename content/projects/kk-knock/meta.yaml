      - file: { en: assets/widgets/en/todo.png, zh: assets/widgets/zh/todo.png }
        alt: { en: The todo widget listing upcoming items, zh: 列出近期事项的待办小组件 }
  - kind: diagram
    id: architecture
    section: architecture
    file: assets/architecture.svg
    source: assets/architecture.mmd
    label: CURRENT
    alt:
      en: "Architecture: the Android app records, transcribes on device and queues captures; Cloudflare connects to the
        self-hosted backend, which classifies text and researches thoughts through configured models; results return to
        the phone."
      zh: 架构图：Android 客户端负责录音、端侧转写和采集排队；Cloudflare 连接自托管后端，后端通过可配置模型分类文字并研究想法；结果回到手机。
    caption:
      en: Data ownership is the main boundary. The phone keeps the notes; the backend owns accounts, usage and prompts, plus a
        short-lived cache of responses used only to replay retries.
      zh: 数据归属是最主要的边界：笔记保存在手机上；后端负责账号、用量和提示词，另有一个只用于重放重试的短期响应缓存。
  - kind: diagram
    id: capture-states
    section: reliability
    file: assets/capture-states.svg
    source: assets/capture-states.mmd
    label: CURRENT
    alt:
      en: "State diagram of a capture job on the phone: recording, transcribing, queued, processing, completed; transcription
        can fail and be retried from the saved audio; processing can fail, or be re-queued for a network retry, and a
        failed job is retried from its saved transcript; old failures are abandoned by the retention rules."
      zh: 手机上采集任务的状态图：录音、转写、排队、处理、完成；转写可能失败，并可用保存的音频重试；处理可能失败，或因网络问题重新排队，失败的任务用保存的转写文本重试；过旧的失败任务按保留规则放弃。
    caption:
      en: The job states in the phone's capture state machine. Retries always reuse what is already saved — the audio or the
        transcript — and the same capture ID.
      zh: 手机端采集状态机中的任务状态。重试总是复用已保存的内容（音频或转写文本）以及同一个捕捉 ID。
  - kind: diagram
    id: capture-flow
    section: reliability
    file: assets/capture-flow.svg
    source: assets/capture-flow.mmd
    label: CURRENT
    alt:
      en: "Sequence: the phone creates a client capture ID, transcribes, stores a receipt, queues the job and posts the
        transcript; the backend either replays a cached response or calls the LLMs, meters the call and caches the
        response."
      zh: 时序图：手机生成客户端捕捉 ID、转写、保存回执、排队并提交转写文本；后端要么回放缓存的响应，要么调用大模型、计量并缓存响应。
    caption:
      en: One client capture ID follows a capture from the first tap to the stored result, so every retry can be recognized.
      zh: 同一个客户端捕捉 ID 从第一次点击一直跟随到结果入库，因此每次重试都能被识别。
