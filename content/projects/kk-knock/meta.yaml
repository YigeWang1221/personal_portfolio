card:
  intro:
    en: I designed and built an Android voice-capture app, its FastAPI backend and React admin console. On-device
      transcription connects to intent classification and research, producing todos and notes stored on the phone.
    zh: 我设计并实现 Android 语音采集应用、FastAPI 后端与 React 管理端，将端侧转写接入意图识别和资料研究，生成保存在手机上的待办与笔记。
  highlight:
    en: "I connected on-device transcription, intent classification and research into a voice workflow: a spoken reminder
      becomes a todo with a due time, while an idea becomes a note with sources. The goal is to reduce typing and manual
      organizing so everyday thoughts can turn into useful next steps at work or in life."
    zh: "我把端侧转写、意图识别和资料研究接成语音工作流：随口说出的安排变成带截止时间的待办，零碎想法则整理成附来源的研究笔记。希望减少打字和手动整理，让生活、工作中的念头更容易变成下一步行动。"
  tech: [ Kotlin Multiplatform, FastAPI, whisper.cpp ]
  figure: screens

facts:
  asr_speedup:
    value: 19.4–19.7 s → 11.9–12.6 s
    label:
      {
        en: "on-device transcription time per clip (Whisper Small), before and after runtime ARM64 kernel selection",
        zh: 端侧单段转写耗时（Whisper Small），运行时选择 ARM64 计算内核前后
      }
    condition: { en: "One test phone (Android 16), short synthetic clips, no thermal control", zh: 单台测试手机（Android 16），短合成音频，未控制温度 }
    claim: KK-04
  cancel_speedup:
    value: 11,373 ms → 0 ms
    label:
      {
        en: "time to cancel a transcription that had not started, before and after a native abort patch",
        zh: 为 whisper.cpp 加入原生中止补丁前后，取消尚未开始的转写所需时间
      }
    condition: { en: "Same test phone; a cancel issued mid-run returns in 16 ms", zh: 同一台测试手机；转写过程中发出的取消在 16 毫秒内返回 }
    claim: KK-05
  asr_before:
    value: 19.4–19.7 s
    label: { en: "Small-model transcription time, baseline CPU path", zh: Small 模型单段转写耗时（CPU 基线） }
    condition: { en: "One test phone (Android 16), short synthetic clips, no thermal control", zh: 单台测试手机（Android 16），短合成音频，未控制温度 }
    claim: KK-04
  asr_after:
    value: 11.9–12.6 s
    label: { en: Small-model transcription time with runtime ARM64 kernel selection, zh: 运行时选择 ARM64 内核后的 Small 模型单段转写耗时 }
    condition: { en: "One test phone (Android 16), short synthetic clips, no thermal control", zh: 单台测试手机（Android 16），短合成音频，未控制温度 }
    claim: KK-04
  asr_window:
    value: { en: 12-second, zh: 12 秒 }
    label: { en: length of each incremental transcription window, zh: 每个增量转写窗口的长度 }
    condition: { en: Windowed batches with a whole-file fallback; not token streaming, zh: 分窗口批量转写，以整段转写兜底；不是逐 token 流式识别 }
    claim: KK-03
  cancel_before:
    value: 11,373 ms
    label: { en: "time to cancel a transcription that had not started, before the patch", zh: 打补丁前，取消尚未开始的转写所需时间 }
    condition: { en: Same test phone; native abort patch to whisper.cpp, zh: 同一台测试手机；为 whisper.cpp 加入原生中止补丁 }
    claim: KK-05
  cancel_after:
    value: 0 ms
    label: { en: "time to cancel a transcription that had not started, after the patch", zh: 打补丁后，取消尚未开始的转写所需时间 }
    condition: { en: Same test phone; native abort patch to whisper.cpp, zh: 同一台测试手机；为 whisper.cpp 加入原生中止补丁 }
    claim: KK-05
  cancel_mid_run:
    value: 16 ms
    label: { en: time for a cancel issued mid-transcription to return, zh: 转写过程中发出取消后的返回时间 }
    condition: { en: "Same test phone, after the native abort patch", zh: 同一台测试手机，打补丁后 }
    claim: KK-05
  idempotency_window:
    value: { en: 14 days, zh: 14 天 }
    label: { en: validity of the server's idempotency cache, zh: 服务端幂等缓存的有效期 }
    condition:
      {
        en: "Keyed by account and client capture ID; holds the returned response (the generated todo or thought), not the
          transcript",
        zh: 以账号和客户端捕捉 ID 为键；保存返回给手机的响应（生成的待办或想法），不保存转写文本
      }
    claim: KK-06
  budgets:
    value: $0.15 / $0.45 / $1.20
    label: { en: "default AI cost budget per usage period (Free / Lite / Pro)", zh: 各套餐每个计费周期的默认 AI 成本预算（Free / Lite / Pro） }
    condition: { en: "Defaults in code, configurable; each usage period keeps an immutable snapshot", zh: 代码默认值，可配置；每个计费周期保存不可变快照 }
    claim: KK-18

