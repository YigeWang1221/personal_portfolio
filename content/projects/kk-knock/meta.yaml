slug: kk-knock
title: { en: KK Knock, zh: KK Knock }
subtitle:
  en: An Android app that turns a spoken sentence into a todo or a researched note
  zh: 说一句话，就整理成待办或查资料写成笔记的 Android App
summary:
  en: KK Knock transcribes speech on the phone, sends only the text to an LLM that files it as a todo with its due time or researches it into a written-up note, and keeps every note on the phone. Built solo, from the Android app to the self-hosted backend.
  zh: KK Knock 在手机上完成语音转写，只把文字交给大模型，整理成带截止时间的待办，或查资料后写成一篇笔记；所有笔记都保存在手机上。从 Android 客户端到自托管后端均由我独立完成。
focus: { primary: planning-delivery, also: [backend-cloud] }
status: self-hosted-pilot
status_note:
  en: Accepted and in daily use on my Android test phone; not yet publicly released
  zh: 已在我的 Android 测试手机上验收并日常使用；尚未公开发布
team: { size: 1 }
role:
  en: Solo. I defined the product, wrote the specifications and decision records, and built and tested the Android app, the backend, the admin console and the self-hosted deployment. AI coding agents wrote much of the code from those specifications; I reviewed what they produced and accepted each phase on the phone.
  zh: 独立完成。我定义产品、编写规格说明和决策记录，并完成 Android 客户端、后端、管理后台和自托管部署的开发与测试。大量代码由 AI 编码助手按这些规格编写，由我审查，每个阶段都在手机上验收。
context: { en: Personal product (pre-release), zh: 个人产品（发布前） }
period: { start: "2026-08", end: null }
stack:
  - Kotlin Multiplatform
  - Jetpack Compose
  - Room
  - WorkManager
  - whisper.cpp (NDK)
  - FastAPI
  - PostgreSQL
  - React
  - Docker Compose
  - Terraform
  - GitHub Actions
links:
  - kind: product
    url: https://introductionkk.wangyige1221.website
    label: { en: Product introduction page, zh: 产品介绍页 }
highlights: [asr_speedup, cancel_speedup, idempotency_window]
lead: screens
deep_dive_from: architecture
# Section ids retired in earlier redesigns, and where they land now.
