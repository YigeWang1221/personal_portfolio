related: cloud-native

card:
  intro:
    en: Speak when your hands are busy. KK Knock transcribes on the phone and turns the text into a todo with its due time, or researches it into a written-up note. I built it alone, from the product definition to the Android app, the FastAPI backend, the admin console and the self-hosted deployment.
    zh: 手上正忙时说一句话，KK Knock 在手机上完成转写，再把文字整理成带截止时间的待办，或查资料写成一篇笔记。从产品定义到 Android 客户端、FastAPI 后端、管理后台和自托管部署，都由我独立完成。
  highlight:
    en: A note survives a killed app or a dropped connection. Each capture keeps one ID from the first tap, and a retry reuses the saved audio or transcript instead of starting over.
    zh: App 被杀或网络中断，笔记也不会丢：每次采集从第一次点击起就只用一个 ID，重试时复用已保存的音频或文字，而不是从头再来。
  status: { en: In daily use on my test phone · not yet released, zh: 已在测试手机上日常使用 · 尚未发布 }
  tech: [Kotlin Multiplatform, FastAPI, whisper.cpp]
  figure: screens

facts:
  asr_speedup:
    value: 19.4–19.7 s → 11.9–12.6 s
    label: { en: "on-device transcription time per clip (Whisper Small), before and after runtime ARM64 kernel selection", zh: 端侧单段转写耗时（Whisper Small），运行时选择 ARM64 计算内核前后 }
    condition: { en: "One test phone (Android 16), short synthetic clips, no thermal control", zh: 单台测试手机（Android 16），短合成音频，未控制温度 }
    claim: KK-04
  cancel_speedup:
    value: 11,373 ms → 0 ms
    label: { en: "time to cancel a transcription that had not started, before and after a native abort patch", zh: 为 whisper.cpp 加入原生中止补丁前后，取消尚未开始的转写所需时间 }
    condition: { en: "Same test phone; a cancel issued mid-run returns in 16 ms", zh: 同一台测试手机；转写过程中发出的取消在 16 毫秒内返回 }
    claim: KK-05
  asr_before:
    value: 19.4–19.7 s
    label: { en: "Small-model transcription time, baseline CPU path", zh: Small 模型单段转写耗时（CPU 基线） }
    condition: { en: "One test phone (Android 16), short synthetic clips, no thermal control", zh: 单台测试手机（Android 16），短合成音频，未控制温度 }
    claim: KK-04
  asr_after:
    value: 11.9–12.6 s
    label: { en: Small-model transcription time with runtime ARM64 kernel selection, zh: 运行时选择 ARM64 内核后的 Small 模型单段转写耗时 }
    condition: { en: "One test phone (Android 16), short synthetic clips, no thermal control", zh: 单台测试手机（Android 16），短合成音频，未控制温度 }
    claim: KK-04
  asr_window:
    value: { en: 12-second, zh: 12 秒 }
    label: { en: length of each incremental transcription window, zh: 每个增量转写窗口的长度 }
    condition: { en: Windowed batches with a whole-file fallback; not token streaming, zh: 分窗口批量转写，以整段转写兜底；不是逐 token 流式识别 }
    claim: KK-03
  cancel_before:
    value: 11,373 ms
    label: { en: "time to cancel a transcription that had not started, before the patch", zh: 打补丁前，取消尚未开始的转写所需时间 }
    condition: { en: Same test phone; native abort patch to whisper.cpp, zh: 同一台测试手机；为 whisper.cpp 加入原生中止补丁 }
    claim: KK-05
  cancel_after:
    value: 0 ms
    label: { en: "time to cancel a transcription that had not started, after the patch", zh: 打补丁后，取消尚未开始的转写所需时间 }
    condition: { en: Same test phone; native abort patch to whisper.cpp, zh: 同一台测试手机；为 whisper.cpp 加入原生中止补丁 }
    claim: KK-05
  cancel_mid_run:
    value: 16 ms
    label: { en: time for a cancel issued mid-transcription to return, zh: 转写过程中发出取消后的返回时间 }
    condition: { en: "Same test phone, after the native abort patch", zh: 同一台测试手机，打补丁后 }
    claim: KK-05
  idempotency_window:
    value: { en: 14 days, zh: 14 天 }
    label: { en: validity of the server's idempotency cache, zh: 服务端幂等缓存的有效期 }
    condition: { en: "Keyed by account and client capture ID; holds the returned response (the generated todo or thought), not the transcript", zh: 以账号和客户端捕捉 ID 为键；保存返回给手机的响应（生成的待办或想法），不保存转写文本 }
    claim: KK-06
  tests:
    value: { en: "~500", zh: 约 500 }
    label: { en: automated test cases, zh: 自动化测试用例 }
    condition: { en: "Test definitions across the backend, the Android app and the admin console, counted in Sep 2026 (a count of cases, not of passing runs)", zh: 后端、Android 客户端与管理后台的测试定义数，2026 年 9 月统计（统计的是用例数，不是通过次数） }
    claim: KK-08
  adrs:
    value: "57"
    label: { en: architecture decision records, zh: 架构决策记录（ADR） }
    condition: { en: "Written in about four weeks, Aug–Sep 2026", zh: 约四周内写成，2026 年 8—9 月 }
    claim: KK-09
  budgets:
    value: $0.15 / $0.45 / $1.20
    label: { en: "default AI cost budget per usage period (Free / Lite / Pro)", zh: 各套餐每个计费周期的默认 AI 成本预算（Free / Lite / Pro） }
    condition: { en: "Defaults in code, configurable; each usage period keeps an immutable snapshot", zh: 代码默认值，可配置；每个计费周期保存不可变快照 }
    claim: KK-18

figures:
  - kind: screens
    id: screens
    section: product
    caption:
      en: From a spoken sentence to a todo with its due time, and to a note written up with its sources. Screenshots from the public product page, with demo data.
      zh: 从说出的一句话，到带截止时间的待办，再到附有参考来源的笔记。截图来自公开的产品介绍页，均为演示数据。
    items:
      - file: { en: assets/screens/en/recording.jpg, zh: assets/screens/zh/recording.jpg }
        alt: { en: "Recording: the live transcript sits above a red waveform", zh: 录音中：红色声波上方显示实时转写的文字 }
        label: { en: 1 · Speak, zh: 1 · 说一句话 }
      - file: { en: assets/screens/en/home_todo.jpg, zh: assets/screens/zh/home_todo.jpg }
        alt: { en: "The todo list, with due times taken from what was said", zh: 待办列表，截止时间取自说话内容 }
        label: { en: 2 · A todo with its due time, zh: 2 · 带截止时间的待办 }
      - file: { en: assets/screens/en/thought_read.jpg, zh: assets/screens/zh/thought_read.jpg }
        alt: { en: A thought written up with a summary and its advantages, zh: 整理成文的想法笔记，包含摘要和优点 }
        label: { en: 3 · A researched note, zh: 3 · 查资料写成的笔记 }
      - file: { en: assets/screens/en/thought_sources.jpg, zh: assets/screens/zh/thought_sources.jpg }
        alt: { en: "The end of a note: recommendation, next steps and sources", zh: 笔记的结尾：建议、后续考虑和参考来源 }
        label: { en: 4 · With its sources, zh: 4 · 附参考来源 }
  - kind: screens
    id: widgets
    section: product
    caption:
      en: "KK Capture, the one-tap home-screen widget: ready, recording, and transcribing on the phone. The fourth image is the todo widget."
      zh: 桌面一键录音小组件 KK Capture：就绪、录音中、正在手机上转写。第四张是待办小组件。
    items:
      - file: { en: assets/capture/idle.png, zh: assets/capture/idle.png }
        alt: { en: "KK Capture ready: a gold waveform on dark green", zh: KK Capture 就绪：深绿底上的金色声波 }
      - file: { en: assets/capture/recording.png, zh: assets/capture/recording.png }
        alt: { en: "KK Capture recording: a red waveform", zh: KK Capture 录音中：红色声波 }
      - file: { en: assets/capture/processing.png, zh: assets/capture/processing.png }
        alt: { en: "KK Capture transcribing: a small progress ring", zh: KK Capture 转写中：右下角的小圆环 }
      - file: { en: assets/widgets/en/todo.png, zh: assets/widgets/zh/todo.png }
        alt: { en: The todo widget listing upcoming items, zh: 列出近期事项的待办小组件 }
  - kind: diagram
    id: architecture
    section: architecture
    file: assets/architecture.svg
    source: assets/architecture.mmd
    label: CURRENT
    alt:
      en: "Architecture: the Android app records, transcribes on device and queues captures; the self-hosted backend classifies text through DeepSeek and researches thoughts through Gemini; results return to the phone."
      zh: 架构图：Android 客户端负责录音、端侧转写和采集排队；自托管后端通过 DeepSeek 分类文字、通过 Gemini 研究想法；结果回到手机。
    caption:
      en: Data ownership is the main boundary. The phone keeps the notes; the backend owns accounts, usage and prompts, plus a short-lived cache of responses used only to replay retries.
      zh: 数据归属是最主要的边界：笔记保存在手机上；后端负责账号、用量和提示词，另有一个只用于重放重试的短期响应缓存。
  - kind: diagram
    id: capture-states
    section: reliability
    file: assets/capture-states.svg
    source: assets/capture-states.mmd
    label: CURRENT
    alt:
      en: "State diagram of a capture job on the phone: recording, transcribing, queued, processing, completed; transcription can fail and be retried from the saved audio; processing can fail, or be re-queued for a network retry, and a failed job is retried from its saved transcript; old failures are abandoned by the retention rules."
      zh: 手机上采集任务的状态图：录音、转写、排队、处理、完成；转写可能失败，并可用保存的音频重试；处理可能失败，或因网络问题重新排队，失败的任务用保存的转写文本重试；过旧的失败任务按保留规则放弃。
    caption:
      en: The job states in the phone's capture state machine. Retries always reuse what is already saved — the audio or the transcript — and the same capture ID.
      zh: 手机端采集状态机中的任务状态。重试总是复用已保存的内容（音频或转写文本）以及同一个捕捉 ID。
  - kind: diagram
    id: capture-flow
    section: reliability
    file: assets/capture-flow.svg
    source: assets/capture-flow.mmd
    label: CURRENT
    alt:
      en: "Sequence: the phone creates a client capture ID, transcribes, stores a receipt, queues the job and posts the transcript; the backend either replays a cached response or calls the LLMs, meters the call and caches the response."
      zh: 时序图：手机生成客户端捕捉 ID、转写、保存回执、排队并提交转写文本；后端要么回放缓存的响应，要么调用大模型、计量并缓存响应。
    caption:
      en: One client capture ID follows a capture from the first tap to the stored result, so every retry can be recognized.
      zh: 同一个客户端捕捉 ID 从第一次点击一直跟随到结果入库，因此每次重试都能被识别。

roadmap:
  section: planning
  title: { en: Delivery phases, zh: 交付阶段 }
  phases:
    - name: { en: Recording and on-device transcription, zh: 录音与端侧转写 }
      detail: { en: "Microphone service, local Whisper, incremental windows, Quick Settings tile, first widgets (phases P3–P3C)", zh: 麦克风前台服务、本地 Whisper、增量窗口、快捷设置磁贴、第一批小组件（阶段 P3—P3C） }
      status: done
    - name: { en: Accounts and background processing, zh: 账号与后台处理 }
      detail: { en: "Shared app API, Android sign-in, the capture job queue, backend identity and the Docker deployment (P4)", zh: 共享 App API、Android 登录、采集任务队列、后端身份体系与 Docker 部署（P4） }
      status: done
    - name: { en: Error recovery and local editing, zh: 错误恢复与本地编辑 }
      detail: { en: "Capture error handling, local editors, widget updates, token handling (P5)", zh: 采集错误处理、本地编辑器、小组件更新、令牌处理（P5） }
      status: done
    - name: { en: Interface foundation and usability fixes, zh: 界面基础与易用性修正 }
      detail: { en: "Search, filters, collections, the note editor, density settings (P6.1–P6.2)", zh: 搜索、筛选、收藏夹、笔记编辑器、界面密度设置（P6.1—P6.2） }
      status: done
    - name: { en: Pre-release experience check, zh: 发布前体验验证 }
      detail: { en: "The visible background queue is accepted on the test phone; the other pre-release checks continue", zh: 可见的后台队列已在测试手机上验收；其余发布前检查仍在进行 }
      status: in-progress
    - name: { en: "Next — public HTTPS, a public release, iOS", zh: 下一步 — 公网 HTTPS、公开发布、iOS }
      detail: { en: "Tunnel acceptance, a downloadable Android release, iOS recording and sign-in, store billing", zh: 隧道验收、可下载的 Android 版本、iOS 录音与登录、应用商店计费 }
      status: planned
