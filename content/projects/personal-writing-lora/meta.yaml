card:
  intro:
    en: I built a platform that trains LoRA adapters from personal writing and loads them through vLLM for chat generation.
    zh: 我开发了一个用个人写作语料训练 LoRA、并通过 vLLM 加载适配器生成对话的平台。
  highlight:
    en: I connected transactional job dispatch, queue-driven GPU capacity and versioned adapter storage to a serving cache
      that protects adapters in use.
    zh: 我将事务内任务分发、队列驱动的 GPU 容量和版本化适配器存储，连接到保护使用中适配器的推理缓存。
  tech: [ vLLM, SQS · Auto Scaling, Terraform ]
  cta: { en: My design and integration work, zh: 查看设计与集成工作 }
  anchor: planning

