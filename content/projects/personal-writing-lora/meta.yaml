slug: personal-writing-lora
title: { en: Personal Writing LoRA Platform, zh: 个人写作风格 LoRA 平台 }
subtitle:
  en: "A personal writing project spanning training, model serving and cloud infrastructure"
  zh: "覆盖训练、模型推理与云基础设施的个人写作项目"
summary:
  en: "I designed the component boundaries, API and training contracts, data model and Terraform infrastructure for a personal writing LoRA platform. I planned implementation milestones, reviewed AI-assisted code, and integrated the queue, GPU training worker and vLLM serving path in an AWS run."
  zh: "我为个人写作 LoRA 平台设计组件边界、API 与训练契约、数据模型及 Terraform 基础设施，制定分阶段实施计划并审查 AI 辅助代码，随后在 AWS 运行中联通任务队列、GPU 训练 worker 与 vLLM 推理链路。"
focus: { primary: backend-cloud, also: [ai-research, planning-delivery] }
status: in-development
status_note:
  en: Completed an end-to-end GPU training and serving run on AWS
  zh: 已在 AWS 上完成 GPU 训练与模型推理的端到端运行
team: { size: 1 }
role:
  en: Solo. I designed every layer — product, API contract, data model, component boundaries, IAM rules and the AWS platform in Terraform — wrote the milestone plans, and ran the AWS training and serving runs. AI coding assistants (Codex, Claude Code) implemented most of the code from my specifications; I reviewed it.
  zh: 独立完成。我设计了所有层次：产品、API 契约、数据模型、组件边界、IAM 规则和用 Terraform 定义的 AWS 平台；编写里程碑计划，并在 AWS 上完成训练和推理运行。大部分代码由 AI 编码助手（Codex、Claude Code）按我的规格实现，由我审查。
context: { en: "AI training and serving infrastructure", zh: "AI 训练与推理基础设施" }
period: { start: "2026-06", end: null }
stack:
  - Next.js 16
  - React 19
  - TypeScript
  - FastAPI
  - SQLAlchemy (async)
  - PostgreSQL
  - Alembic
  - Amazon SQS
  - Amazon S3
  - PyTorch · PEFT · TRL
  - vLLM
  - Terraform
  - Packer
