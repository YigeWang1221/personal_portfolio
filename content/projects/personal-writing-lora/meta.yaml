    - name: { en: T1 — dataset builder on a tiny fixture, zh: T1 — 数据集构建器（基于小型样例） }
      status: done
    - name: { en: "T2 — local worker: idempotency, checkpoints, callbacks", zh: T2 — 本地 worker：幂等、检查点、回调 }
      status: done
    - name: { en: W1 — adapter manager, zh: W1 — 适配器管理服务 }
      status: done
    - name: { en: T3 — real single-GPU training and vLLM load, zh: T3 — 真实单卡训练并由 vLLM 加载 }
