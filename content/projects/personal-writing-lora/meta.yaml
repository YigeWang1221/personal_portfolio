figures:
  - kind: image
    id: wireframe-main
    section: planning
    file: assets/wireframe-main-page.svg
    label: HISTORICAL
    alt:
      en: "Early wireframe of the main workspace: a project and chat sidebar, a chat box, a Markdown answer area with a drafts panel, and a create-project dialog that picks a base model and a LoRA."
      zh: 主工作区的早期线框图：项目与对话侧栏、对话输入框、带草稿面板的 Markdown 回答区，以及选择基座模型和 LoRA 的新建项目对话框。
    caption:
      en: "Early wireframe, June 2026 (working name QVoice). The information architecture carried into the implemented pages."
      zh: 早期线框图，2026 年 6 月（当时的工作名为 QVoice）。其信息架构延续到了最终实现的页面中。
  - kind: image
    id: wireframe-style
    section: planning
    file: assets/wireframe-style-create.svg
    label: HISTORICAL
    alt:
      en: "Early wireframe of the style pages: a style list with versions and status colours, a style detail view with re-train and delete, and the new-style flow."
      zh: 风格页面的早期线框图：带版本与状态颜色的风格列表、可重新训练或删除的风格详情，以及新建风格流程。
    caption:
      en: "Early wireframe, June 2026. Its note that training data would not be saved on the server predates the implementation: sources are stored temporarily for training and removed by a cleanup job afterwards."
      zh: 早期线框图，2026 年 6 月。图中"不在服务器保存训练数据"的批注早于实现：实际做法是训练期间临时保存源文件，训练结束后由清理任务删除。
  - kind: image
    id: er-sketch
    section: planning
    file: assets/er-sketch.svg
    label: HISTORICAL
    alt:
      en: "Early entity-relationship sketch: user profiles, workspaces, chats, messages, models, LoRA sets, LoRAs, source-file lists, source files and training jobs."
      zh: 早期实体关系草图：用户资料、工作区、对话、消息、模型、LoRA 集合、LoRA、源文件列表、源文件和训练任务。
    caption:
      en: "Early ER sketch, June 2026. Its entities map one to one onto the implemented tables; the implementation adds sessions, upload batches and two outbox tables."
      zh: 早期 ER 草图，2026 年 6 月。其中的实体与最终实现的表一一对应；实现时又增加了会话、上传批次和两张发件箱表。
  - kind: diagram
    id: current-architecture
    section: architecture
    file: assets/current-architecture.svg
    source: assets/current-architecture.mmd
    label: CURRENT
    alt:
      en: "Current architecture: a Next.js app and a FastAPI backend on PostgreSQL; training jobs go through an outbox to an SQS queue and a training worker that publishes adapters to S3; an adapter manager in front of vLLM serves them."
      zh: 当前架构：Next.js 前端与基于 PostgreSQL 的 FastAPI 后端；训练任务经发件箱进入 SQS 队列，由训练 worker 处理并把适配器发布到 S3；vLLM 前的适配器管理服务负责加载和推理。
    caption:
      en: As implemented. The automated tests run it locally against a real PostgreSQL and fake S3, SQS, GPU and vLLM services; the same components ran on AWS for the training and serving runs.
      zh: 按实现绘制。自动化测试在本地运行，使用真实的 PostgreSQL 和替身形式的 S3、SQS、GPU 与 vLLM 服务；同样的组件也在 AWS 上完成了训练和推理运行。
  - kind: diagram
    id: worker-lifecycle
    section: job-handoff
    file: assets/training-worker-lifecycle.svg
    source: assets/training-worker-lifecycle.mmd
    label: CURRENT
    alt:
      en: "Training worker sequence: receive one SQS message, claim the job with a conditional S3 write, protect the instance from scale-in, send lease heartbeats while training, publish the adapter and its manifest, call back the backend, delete the message and release protection."
      zh: 训练 worker 时序图：接收一条 SQS 消息，用 S3 条件写入认领任务，开启缩容保护，训练期间发送租约心跳，发布适配器及其 manifest，回调后端，删除消息并解除保护。
    caption:
      en: Implemented in the worker, tested against local fakes, and used in the AWS training runs.
      zh: 已在 worker 中实现，基于本地替身测试，并在 AWS 上的训练运行中使用。
  - kind: diagram
    id: aws-platform
    section: infrastructure
    file: assets/aws-platform.svg
    source: assets/aws-platform.mmd
    label: CURRENT
    alt:
      en: "AWS topology: a load balancer and one NAT gateway in public subnets across two zones; a backend Auto Scaling group and one serving GPU instance in private subnets; RDS PostgreSQL, S3 and SQS encrypted with KMS; a GPU training Auto Scaling group that scales from zero on queue backlog."
      zh: AWS 拓扑：负载均衡器和一个 NAT 网关位于跨两个可用区的公有子网；后端 Auto Scaling 组和一台推理 GPU 实例位于私有子网；RDS PostgreSQL、S3 和 SQS 均用 KMS 加密；GPU 训练 Auto Scaling 组根据队列积压从零扩容。
    caption:
      en: Drawn from the Terraform. Applied for the training and serving runs and destroyed afterwards, so no environment is running now.
      zh: 依据 Terraform 绘制。为训练和推理运行实际 apply 过，之后已销毁，目前没有在运行的环境。

roadmap:
  section: planning
  title: { en: Training (T) and serving (W) milestones, zh: 训练（T）与推理（W）里程碑 }
  phases:
    - name: { en: Contracts first, zh: 先定接口契约 }
      detail: { en: "JSON Schema and OpenAPI, with valid and deliberately invalid examples (T0 / W0)", zh: JSON Schema 与 OpenAPI，附有效示例和刻意构造的无效示例（T0 / W0） }
      status: done
    - name: { en: "Dataset builder, local training worker and adapter manager", zh: 数据集构建器、本地训练 worker 与适配器管理服务 }
      detail: { en: "Idempotency, checkpoints and callbacks, tested against local fakes (T1, T2, W1)", zh: 幂等、检查点与回调，基于本地替身测试（T1、T2、W1） }
      status: done
    - name: { en: "Real training on a GPU, loaded by vLLM", zh: 在 GPU 上真实训练，并由 vLLM 加载 }
      detail: { en: "Trained on my own writing and served from one GPU on AWS (T3, W2)", zh: 用我自己的文字训练，并在 AWS 的一块 GPU 上提供推理（T3、W2） }
      status: done
    - name: { en: Training image and scale-from-zero, zh: 训练镜像与从零扩容 }
      detail: { en: "The training group scaled up from zero on queued work (T4)", zh: 训练组根据排队任务从零扩容（T4） }
      status: done
    - name: { en: A style that sounds like its writer, zh: 生成的风格要像作者本人 }
      detail: { en: "More and cleaner personal writing, and a before-and-after style check", zh: 更多、更干净的个人语料，以及训练前后的风格对比 }
      status: in-progress
    - name: { en: "Serving image, multi-user isolation benchmark, internal load balancer", zh: 推理镜像、多用户隔离基准测试、内部负载均衡 }
      detail: { en: (W3–W5), zh: （W3—W5） }
      status: planned
    - name: { en: "Failure drills, observability, runbook", zh: 故障演练、可观测性、运维手册 }
      detail: { en: (T5), zh: （T5） }
      status: planned
