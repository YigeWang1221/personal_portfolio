slug: personal-writing-lora
title: { en: Personal Writing LoRA Platform, zh: 个人写作风格 LoRA 平台 }
subtitle:
  en: A multi-tenant platform that fine-tunes a LoRA on each user's own writing and serves many of them from one GPU
  zh: 基于每位用户自己的文字微调专属 LoRA、并在单卡上同时服务多个 LoRA 的多租户平台
summary:
  en: Users upload their own writing, the platform trains a personal LoRA "style" on a pinned Qwen2.5-7B-Instruct base, and they draft long-form Markdown with it. Designed from wireframes and contracts through dated milestone plans, implemented across four repositories and tested against local fakes — it has not been deployed.
  zh: 用户上传自己的文字，平台基于固定版本的 Qwen2.5-7B-Instruct 训练个人 LoRA"风格"，再用它撰写长篇 Markdown。项目从线框图和接口契约出发，经过带日期的里程碑计划，在四个仓库中实现并基于本地替身完成测试，目前尚未部署。
tracks: { primary: cloud-llm, also: [sde] }
status: implemented-not-deployed
team: { size: 1 }
role:
  en: Sole designer across all layers; implemented with AI coding assistants working from my specifications
  zh: 各层唯一的设计者；由 AI 编码助手按我的规格说明实现
context: { en: Personal project, zh: 个人项目 }
period: { start: "2026-06", end: "2026-08" }
