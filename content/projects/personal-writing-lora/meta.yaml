figures:
  - kind: image
    id: wireframe-main
    section: planning
    file: assets/wireframe-main-page.svg
    label: HISTORICAL
    alt:
      en: "Early wireframe of the main workspace: a project and chat sidebar, a chat box, a Markdown answer area with a drafts
        panel, and a create-project dialog that picks a base model and a LoRA."
      zh: 主工作区的早期线框图：项目与对话侧栏、对话输入框、带草稿面板的 Markdown 回答区，以及选择基座模型和 LoRA 的新建项目对话框。
    caption:
      en: "Early wireframe, June 2026 (working name QVoice). The information architecture carried into the implemented pages."
      zh: 早期线框图，2026 年 6 月（当时的工作名为 QVoice）。其信息架构延续到了最终实现的页面中。
  - kind: image
    id: wireframe-style
    section: planning
    file: assets/wireframe-style-create.svg
    label: HISTORICAL
    alt:
      en: "Early wireframe of the style pages: a style list with versions and status colours, a style detail view with
        re-train and delete, and the new-style flow."
      zh: 风格页面的早期线框图：带版本与状态颜色的风格列表、可重新训练或删除的风格详情，以及新建风格流程。
    caption:
      en: "Early wireframe, June 2026. Its note that training data would not be saved on the server predates the
        implementation: sources are stored temporarily for training and removed by a cleanup job afterwards."
      zh: 早期线框图，2026 年 6 月。图中"不在服务器保存训练数据"的批注早于实现：实际做法是训练期间临时保存源文件，训练结束后由清理任务删除。
  - kind: image
    id: er-sketch
    section: planning
    file: assets/er-sketch.svg
    label: HISTORICAL
    alt:
      en: "Early entity-relationship sketch: user profiles, workspaces, chats, messages, models, LoRA sets, LoRAs, source-file
        lists, source files and training jobs."
      zh: 早期实体关系草图：用户资料、工作区、对话、消息、模型、LoRA 集合、LoRA、源文件列表、源文件和训练任务。
    caption:
      en: "Early ER sketch, June 2026. Its entities map one to one onto the implemented tables; the implementation adds
        sessions, upload batches and two outbox tables."
      zh: 早期 ER 草图，2026 年 6 月。其中的实体与最终实现的表一一对应；实现时又增加了会话、上传批次和两张发件箱表。
  - kind: diagram
    id: current-architecture
    section: architecture
    file: assets/current-architecture.svg
    source: assets/current-architecture.mmd
    label: CURRENT
    alt:
      en: "Current architecture: a Next.js app and a FastAPI backend on PostgreSQL; training jobs go through an outbox to an
        SQS queue and a training worker that publishes adapters to S3; an adapter manager in front of vLLM serves them."
      zh: 当前架构：Next.js 前端与基于 PostgreSQL 的 FastAPI 后端；训练任务经发件箱进入 SQS 队列，由训练 worker 处理并把适配器发布到 S3；vLLM 前的适配器管理服务负责加载和推理。
    caption:
      en: The product backend dispatches training jobs; the worker publishes adapters for the serving layer.
      zh: 产品后端分发训练任务，worker 发布适配器，推理层加载并提供对话服务。
  - kind: diagram
    id: worker-lifecycle
    section: job-handoff
    file: assets/training-worker-lifecycle.svg
    source: assets/training-worker-lifecycle.mmd
    label: CURRENT
    alt:
      en: "Training worker sequence: receive one SQS message, claim the job with a conditional S3 write, protect the instance
        from scale-in, send lease heartbeats while training, publish the adapter and its manifest, call back the
        backend, delete the message and release protection."
      zh: 训练 worker 时序图：接收一条 SQS 消息，用 S3 条件写入认领任务，开启缩容保护，训练期间发送租约心跳，发布适配器及其 manifest，回调后端，删除消息并解除保护。
    caption:
      en: The worker coordinates the job lease, adapter publication and result callback.
      zh: worker 协调任务租约、适配器发布与结果回调。
  - kind: diagram
    id: aws-platform
    section: infrastructure
    file: assets/aws-platform.svg
    source: assets/aws-platform.mmd
    label: CURRENT
    alt:
      en: "AWS topology: a load balancer and one NAT gateway in public subnets across two zones; a backend Auto Scaling group
        and one serving GPU instance in private subnets; RDS PostgreSQL, S3 and SQS encrypted with KMS; a GPU training
        Auto Scaling group that scales from zero on queue backlog."
      zh: AWS 拓扑：负载均衡器和一个 NAT 网关位于跨两个可用区的公有子网；后端 Auto Scaling 组和一台推理 GPU 实例位于私有子网；RDS PostgreSQL、S3 和 SQS 均用 KMS 加密；GPU 训练
        Auto Scaling 组根据队列积压从零扩容。
    caption:
      en: Terraform connects the product, training and serving components through AWS networking, queues and storage.
      zh: Terraform 通过 AWS 网络、队列与存储连接产品、训练和推理组件。
