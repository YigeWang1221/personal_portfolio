      status: in-progress
    - name: { en: W2 — vLLM with a real LoRA on one GPU, zh: W2 — 单卡 vLLM 加载真实 LoRA }
      status: planned
    - name: { en: "W3–W5 — serving AMI, isolation benchmark, internal load balancer", zh: W3—W5 — 推理 AMI、多用户隔离基准测试、内部负载均衡 }
