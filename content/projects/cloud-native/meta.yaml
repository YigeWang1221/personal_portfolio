slug: cloud-native
title: { en: Cloud-Native Web Application on AWS, zh: AWS 云原生 Web 应用 }
subtitle:
  en: "A Spring Boot service with infrastructure and release automation on AWS"
  zh: "Spring Boot 后端与 AWS 基础设施、自动化交付"
summary:
  en: "I built a Spring Boot API and its AWS platform: Terraform-managed VPC, EC2 Auto Scaling, ALB, RDS, S3, IAM, KMS and Secrets Manager; Route 53 and HTTPS; GitHub Actions with Packer AMI delivery across accounts; and SNS-triggered Lambda verification emails through Mailgun."
  zh: "我实现 Spring Boot API 及 AWS 平台：用 Terraform 配置 VPC、EC2 Auto Scaling、ALB、RDS、S3、IAM、KMS 和 Secrets Manager，配置 Route 53 与 HTTPS，设计 GitHub Actions/Packer 跨账号镜像交付，并实现 SNS 触发 Lambda、经 Mailgun 发送验证邮件。"
focus: { primary: backend-cloud, also: [] }
status: course-project
status_note:
  en: "Deployed on AWS with automated image builds and rolling releases"
  zh: "已在 AWS 部署，完成自动镜像构建与多次滚动发布"
team: { size: 1 }
role:
  en: "I implemented the API, Terraform infrastructure, domain and HTTPS configuration, Packer images and GitHub Actions CI/CD. I also built the SNS-triggered Lambda email-verification function and its release workflow."
  zh: "我负责 API、Terraform 基础设施、域名与 HTTPS 配置、Packer 镜像和 GitHub Actions CI/CD，并实现 SNS 触发的 Lambda 邮件验证函数及其发布工作流。"
context: { en: "Backend and cloud infrastructure", zh: "后端与云基础设施" }
period: { start: "2025-09", end: "2025-11" }
