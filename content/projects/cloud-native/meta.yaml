  - GitHub Actions
  - AWS VPC · EC2 · ALB · Auto Scaling
  - RDS
  - S3
  - KMS
  - Secrets Manager
  - SNS → Lambda → Mailgun
  - Route 53 · HTTPS
  - CloudWatch
links: []
