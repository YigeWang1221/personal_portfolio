      detail: { en: "Product APIs; RDS, its subnet group and the instance role in Terraform", zh: 商品接口；在 Terraform 中定义 RDS、其子网组与实例角色 }
      when: { en: Oct 2025, zh: 2025 年 10 月 }
      status: done
    - name: { en: A07 — observability and DNS, zh: A07 — 可观测性与 DNS }
