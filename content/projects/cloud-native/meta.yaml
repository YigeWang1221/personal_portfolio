slug: cloud-native
title: { en: Cloud-Native Web Application on AWS, zh: AWS 云原生 Web 应用 }
subtitle:
  en: A Spring Boot API on AWS, released as new machine images and defined end to end in Terraform
  zh: 运行在 AWS 上的 Spring Boot API：每次发布都是一个新的机器镜像，整个平台用 Terraform 定义
summary:
  en: A Spring Boot REST API on Packer-built images in an Auto Scaling group behind an HTTPS load balancer, with the network, data stores, keys and alarms defined in Terraform. GitHub Actions tests every pull request and rolls each merge out as a new image, promoted from a dev account to a demo account.
  zh: 一个 Spring Boot REST API，运行在 HTTPS 负载均衡器后的 Auto Scaling 组中，机器镜像由 Packer 构建；网络、数据存储、密钥和告警都由 Terraform 定义。GitHub Actions 测试每个 PR，并把每次合并做成新镜像，从 dev 账号晋升到 demo 账号后滚动上线。
focus: { primary: backend-cloud, also: [] }
status: course-project
status_note:
  en: Deployed and released repeatedly during the course; scaling was never load-tested
  zh: 课程期间已部署并多次发布；自动伸缩没有做过压测
team: { size: 1 }
role:
  en: "Individual coursework. The course set the milestones; the implementation is mine: the API, the Terraform, the Packer image, the GitHub Actions workflows and the serverless email function."
  zh: 个人课程作业。里程碑由课程规定，实现全部由我完成：API、Terraform、Packer 镜像、GitHub Actions 工作流和无服务器邮件函数。
context: { en: "Course project, CSYE 6225 Network Structures & Cloud Computing", zh: 课程项目，CSYE 6225 网络架构与云计算 }
