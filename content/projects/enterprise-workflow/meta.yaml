figures:
  - kind: diagram
    id: donation-flow
    section: workflow
    file: assets/donation-flow.svg
    source: assets/donation-flow.mmd
    label: CURRENT
    alt:
      en: "Flow of one donation: a food provider submits it into the network's inspection queue; an inspector approves it into the warehouse queue; a shelter helper pairs it with a pending shelter request and creates a delivery task; a task manager assigns an unassigned task to a driver; the driver marks it picked up and then delivered."
      zh: 一份捐赠的流程：食品提供方把捐赠提交到网络的检验队列；检验员批准后移入仓库队列；救助站助理把它与一条待处理的收容请求配对，生成配送任务；任务调度员把未分配的任务派给司机；司机先标记已取货，再标记已送达。
    caption:
      en: Traced from the screens' event handlers. Each arrow is a real handler; the labels are the status values the code sets.
      zh: 依据各界面的事件处理代码梳理。每个箭头都对应真实存在的处理函数，标注的是代码实际写入的状态值。
  - kind: diagram
    id: domain-model
    section: domain-model
    file: assets/domain-model.svg
    source: assets/domain-model.mmd
    label: CURRENT
    alt:
      en: "Class diagram of the objects on the donation path: a network owns an inspection queue, a warehouse queue, enterprises and user accounts; enterprises and organizations each own a work queue; a user account has one role, and each role builds its own work screen; the driver role keeps its own active and finished queues; work requests carry a sender, a receiver and a status, with food-item, delivery and needs requests as subclasses."
      zh: 捐赠路径上各对象的类图：网络拥有检验队列、仓库队列、企业和用户账号；企业和组织各自拥有工作队列；用户账号只有一个角色，每个角色构建自己的工作界面；司机角色另有进行中和已完成两个队列；工作请求带有发送方、接收方和状态，食品、配送和需求请求是它的子类。
    caption:
      en: A partial class diagram, redrawn from the model package. Only the objects on the donation path are shown.
      zh: 依据 model 包重新绘制的局部类图，只画出捐赠路径上的对象。
