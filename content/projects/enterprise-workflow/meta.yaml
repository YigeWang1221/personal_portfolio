slug: enterprise-workflow
title: { en: "FoodShelter: Food-Rescue Workflow System", zh: FoodShelter：食物救助多组织协作系统 }
subtitle:
  en: A desktop system that moves food donations through inspection, matching and delivery across several organizations
  zh: 让食物捐赠在多个组织之间依次完成检验、匹配和配送的桌面系统
summary:
  en: In a team of three, we built a Java Swing system in which donors, inspectors, a shelter network, task managers and drivers each work in their own screen, and a donation moves between them as requests in shared work queues. I designed the domain model and the persistence layer.
  zh: 我们三人团队用 Java Swing 开发了这个系统：捐赠方、检验员、救助网络、任务调度员和司机各有自己的工作界面，一份捐赠以请求的形式在共享工作队列之间流转。我负责设计领域模型和持久化层。
focus: { primary: business-modeling, also: [] }
status: course-project
team: { size: 3 }
role:
  en: Designed the domain model and the persistence layer; co-implemented the inspection, matching, task-manager and driver workflows
  zh: 设计领域模型与持久化层；参与实现检验、匹配、任务调度和司机配送工作流
context: { en: "Course project, INFO 5100 Application Engineering & Development", zh: 课程项目，INFO 5100 应用工程与开发 }
