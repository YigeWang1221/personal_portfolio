slug: enterprise-workflow
title: { en: "FoodShelter: Food-Rescue Workflow System", zh: FoodShelter：食物救助多组织协作系统 }
subtitle:
  en: "Domain modeling and shared workflow implementation for food rescue"
  zh: "食物救助业务的领域建模与团队工作流实现"
summary:
  en: "In a team of three, I designed the domain model and db4o persistence, implemented the application shell and role-based login, and co-implemented workflow screens. The project shows how I translated organizational responsibilities into objects, work queues and role-specific interfaces."
  zh: "在三人团队中，我设计领域模型与 db4o 持久化，实现应用主框架和按角色分派的登录，并参与工作流界面开发，将组织职责转化为对象、工作队列和各角色的操作界面。"
focus: { primary: business-modeling, also: [] }
status: course-project
team: { size: 3 }
role:
  en: "In a team of three, I designed the domain model and persistence layer, implemented the application shell and role-based login, and co-developed the donation, inspection and delivery workflow screens."
  zh: 在三人团队中，我负责领域模型与持久化设计，实现应用主框架和角色登录，并共同开发捐赠、检验与配送工作流界面。
context: { en: "Domain modeling and workflow implementation", zh: "领域建模与工作流实现" }
