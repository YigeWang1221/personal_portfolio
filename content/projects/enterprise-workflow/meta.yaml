    source: assets/domain-model.mmd
    label: CURRENT
    alt:
      en: "Class diagram: the system holds networks; each network has enterprises, each enterprise has organizations, organizations hold user accounts with roles; networks own work queues that hold delivery, food-item and needs requests."
      zh: 类图：系统包含多个网络；每个网络下有企业，企业下有组织，组织中的用户账号各有角色；网络拥有工作队列，队列中是配送、食品和需求请求。
    caption:
      en: Redrawn from the code. The hierarchy lets a request move between organizations without the screens knowing about each other.
      zh: 依据代码重新绘制。这套层级让请求可以在组织之间流转，而各个界面之间无需互相了解。
