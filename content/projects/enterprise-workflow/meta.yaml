slug: enterprise-workflow
title: { en: "FoodShelter: Food-Rescue Workflow System", zh: FoodShelter：食物救助多组织协作系统 }
subtitle:
  en: A desktop system that routes food donations, inspections and deliveries between organizations
  zh: 在多个组织之间流转食物捐赠、检验与配送任务的桌面系统
summary:
  en: In a team of three, we built a Java Swing system that coordinates food rescue across donors, inspectors, a rescue network, drivers, task managers and administrators. I designed its domain model and persistence layer.
  zh: 我们三人团队用 Java Swing 开发了一个食物救助协作系统，连接捐赠方、检验员、救助网络、司机、任务调度员和管理员。我负责设计它的领域模型和持久化层。
tracks: { primary: sde, also: [] }
status: course-project
team: { size: 3 }
role:
  en: Designed the domain model and the persistence layer; co-implemented the task-manager, driver, inspection and rescue-network workflows
  zh: 设计领域模型与持久化层；参与实现任务调度、司机配送、食品检验和救助网络工作流
context: { en: "Course project, INFO 5100 Application Engineering & Development", zh: 课程项目，INFO 5100 应用工程与开发 }
