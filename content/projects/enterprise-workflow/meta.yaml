overview:
  problem:
    en: A food donation has to pass through several independent organizations — the donor, an inspection team, a shelter network, a volunteer dispatch team — and each person should see only the work that is theirs to do.
    zh: 一份食物捐赠要经过多个彼此独立的组织：捐赠方、检验团队、救助网络、志愿者调度团队；每个人只应看到属于自己的工作。
  contributions:
    - en: Designed the object model — network, enterprise, organization, account, role, work queue and the request types — and the db4o persistence around it.
      zh: 设计对象模型（网络、企业、组织、账号、角色、工作队列和各类请求），以及围绕它的 db4o 持久化。
    - en: Wrote the application shell and the role-based login, and co-implemented the inspection, matching, task-manager and driver screens with my teammates.
      zh: 编写应用主框架与按角色分派的登录；与队友共同实现检验、匹配、任务调度和司机界面。
  outcome:
    en: A completed course project that runs a donation end to end on seeded demo data. It has no automated tests, and several state rules are enforced only by which screen a user is given.
    zh: 已完成的课程项目，可以在预置演示数据上跑通一份捐赠的完整流程。项目没有自动化测试，部分状态规则只靠"用户能进入哪个界面"来保证。

card:
  question:
    en: How does one donation pass through five roles in separate organizations without the screens knowing about each other?
    zh: 一份捐赠如何经过分属不同组织的五种角色，而各个界面彼此互不依赖？
  contribution:
    en: Designed the domain model and persistence; co-implemented the workflow screens (team of three).
    zh: 设计领域模型与持久化；参与实现各工作流界面（三人团队）。
  tech: [Java, Swing, db4o]
  cta: { en: Explore the domain model, zh: 查看领域模型 }
  anchor: domain-model
  steps:
    label: CURRENT
    items:
      - { title: { en: Food provider donates, zh: 食品提供方提交捐赠 }, detail: "Pending" }
      - { title: { en: Fresh checker approves, zh: 检验员批准 }, detail: "accepted · stored" }
      - { title: { en: Shelter helper matches a request, zh: 救助站助理匹配需求 }, detail: "UnPick" }
      - { title: { en: Task manager assigns a driver, zh: 任务调度员指派司机 }, detail: "Waiting to be picked up" }
      - { title: { en: Driver delivers, zh: 司机完成配送 }, detail: "Delivered" }
    note: { en: Status values as the code writes them, zh: 状态值即代码中写入的字符串 }

