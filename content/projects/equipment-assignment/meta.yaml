      en: "Architecture: teacher, student and guest views in a Vue 3 frontend call a Spring Boot backend with role interceptors and services for equipment, classes and groups, homework, the showcase and exports; data lives in MySQL, media in MinIO, and documents are produced with Apache POI and html2pdf."
      zh: 架构图：Vue 3 前端的教师、学生和访客页面调用 Spring Boot 后端；后端有按角色划分的拦截器，以及设备、班级与分组、作业、作品展示和导出等服务；数据存于 MySQL，媒体存于 MinIO，文档由 Apache POI 和 html2pdf 生成。
