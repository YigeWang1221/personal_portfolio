slug: equipment-assignment
title: { en: Equipment & Assignment Grading System, zh: 设备借用与作业批改平台 }
subtitle:
  en: A teaching platform for an IoT course — equipment loans, group homework with a collaborative editing lock, grading and media
  zh: 物联网课程的教学平台：设备借用、带协同编辑锁的小组作业、作业批改与媒体管理
summary:
  en: My undergraduate capstone. A Vue 3 and Spring Boot platform that runs an IoT course end to end — equipment borrowing with approval, classes and groups, homework that a group edits together, grading, PDF export, and course videos that play from object storage and can be scrubbed without downloading the whole file.
  zh: 我的本科毕业设计。一个基于 Vue 3 与 Spring Boot 的平台，覆盖一门物联网课程的完整流程：带审批的设备借用、班级与分组、小组协同编辑的作业、作业批改、PDF 导出，以及存放在对象存储中、无需完整下载即可拖动播放的课程视频。
