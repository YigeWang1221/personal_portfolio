slug: distributed-llm
title: { en: Distributed LLM Training on HPC, zh: HPC 集群上的分布式大模型训练 }
subtitle:
  en: "Parallel data preparation and distributed-training experiments on an HPC cluster"
  zh: "HPC 集群上的并行数据处理与分布式训练实验"
summary:
  en: "In a team of two, I led distributed-training implementation and experiment analysis: parallel OpenWebText tokenization, DDP and FSDP trainers, and GPU runs organized with Slurm and torchrun. My teammate helped connect to the cluster; we report the benchmark results as team work."
  zh: "在两人团队中，我主导分布式训练实现与实验分析，工作覆盖 OpenWebText 并行分词、DDP 与 FSDP 训练器，以及使用 Slurm 和 torchrun 组织 GPU 实验。同学协助连接集群，基准实验结果作为团队成果展示。"
focus: { primary: ai-research, also: [backend-cloud] }
status: course-benchmark
team: { size: 2 }
role:
  en: "Team of two. I led the distributed-training implementation and experiment analysis, implemented parallel tokenization, and contributed to both the DDP and FSDP trainers and their debugging. My teammate helped connect to the Slurm cluster. Benchmark results are reported as team work."
  zh: "两人团队。我主导分布式训练实现与实验分析，编写并行分词，参与 DDP 和 FSDP 训练器的实现与调试；同学协助连接 Slurm 集群。基准实验结果作为团队成果展示。"
context: { en: "Distributed training and performance analysis", zh: "分布式训练与性能分析" }
period: { start: "2026-03", end: "2026-04" }
stack: [PyTorch, DDP, FSDP, NCCL, torchrun, Slurm, tiktoken, Hugging Face datasets, NumPy memmap]
