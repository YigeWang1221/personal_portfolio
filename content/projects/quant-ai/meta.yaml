    file: assets/pipeline.svg
    source: assets/pipeline.mmd
    label: CURRENT
    alt:
      en: "Pipeline: cached daily prices and ETF data become 35 factors and an ETF-factor residual label; a Transformer with temporal and cross-stock attention is trained over expanding walk-forward folds; evaluation runs a cost-aware long/short backtest and offline sweeps."
      zh: 管线图：缓存的日线价格和 ETF 数据被整理成 35 个因子和 ETF 因子残差标签；带时间维与跨股票注意力的 Transformer 在扩展式滚动前推折上训练；评估环节运行计入成本的多空回测和离线参数扫描。
    caption:
      en: Version 4.5 of the research package. Module contracts fix tensor shapes and file schemas between the stages.
      zh: 研究代码包的 4.5 版本。模块契约规定了各阶段之间的张量形状和文件格式。
