  description: 王一格，软件工程师（后端与系统方向）。中英双语的项目案例：业务建模、后端与云端交付、系统规划。
  intro: 我关注业务流程如何落到软件系统中，重点是面向对象设计、后端开发与云端交付。
  background_line: 美国东北大学（Northeastern University）· 软件工程系统硕士 · 预计 2026 年 12 月毕业
