  background_body: 我即将在美国东北大学（波士顿）完成软件工程系统硕士学业，本科毕业于浙江工商大学计算机科学与技术专业。曾在 Vendream（万郡绿建）担任后端开发实习生，在中国工商银行软件开发中心担任软件测试实习生。目前在开发 KK Knock，一款后端托管在我自己硬件上的语音速记 App。
